---
# Pinned downloads (FR-016, research R11). Each one goes through `fetch-verified`, which checks
# the SHA-256 below before the file is used. Checked on 2026-10-12.
#
# | Download                                              | Version | SHA-256 source                  |
# |-------------------------------------------------------|---------|---------------------------------|
# | rustup-init x86_64-unknown-linux-gnu                  | 1.29.1  | published rustup-init.sha256    |
# | rustup-init aarch64-apple-darwin                      | 1.29.1  | published rustup-init.sha256    |
# | rustup-init.exe x86_64-pc-windows-msvc                | 1.29.1  | published rustup-init.exe.sha256 |
# | cross-x86_64-unknown-linux-musl.tar.gz                | 0.2.5   | none published: computed 2026-10-12 |
# | cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz    | 0.20.2  | published .sha256               |
# | gh_2.102.0_linux_amd64.tar.gz                         | 2.102.0 | gh_2.102.0_checksums.txt        |
# | go-containerregistry_Linux_x86_64.tar.gz (crane)      | 0.22.1  | checksums.txt                   |
version: 2.1

orbs:
  win: circleci/windows@5.1.1

# Pinned Rust for CI (docs/rust-guidelines.md §2.2); keep in step with the Dockerfile.
# RUSTUP_TOOLCHAIN makes it win over rust-toolchain.toml, which tracks latest stable.
parameters:
  rust-version:
    type: string
    default: "1.99"
  # Manual release rehearsal (FR-011): builds and tests everything a release does, publishes
  # nothing. Start it with `circleci pipeline run … --param rehearsal=true` (docs/ci.md).
  rehearsal:
    type: boolean
    default: false
  # Set by the weekly schedule trigger (FR-026): the gates on the newest stable Rust.
  newest-toolchain:
    type: boolean
    default: false

executors:
  rust:
    docker:
      - image: rust:<< pipeline.parameters.rust-version >>
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  node:
    docker:
      - image: node:24
  python:
    docker:
      - image: python:3.14
  linux-machine:
    machine:
      image: ubuntu-2604:current
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  macos:
    macos:
      xcode: "27.0"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>

commands:
  fetch-verified:
    description: Download a file and stop unless its SHA-256 matches the pinned value
    parameters:
      url:
        type: string
      sha256:
        type: string
      dest:
        type: string
      shell:
        type: string
        default: /bin/bash -eo pipefail
    steps:
      - run:
          name: Fetch << parameters.dest >>
          shell: << parameters.shell >>
          command: |
            curl -fsSL -o "<< parameters.dest >>" "<< parameters.url >>"
            if command -v sha256sum >/dev/null 2>&1; then
              echo "<< parameters.sha256 >>  << parameters.dest >>" | sha256sum -c -
            else
              echo "<< parameters.sha256 >>  << parameters.dest >>" | shasum -a 256 -c -
            fi

  install-rustup:
    description: Install the pinned Rust toolchain with a verified rustup-init
    parameters:
      triple:
        type: string
        default: x86_64-unknown-linux-gnu
      sha256:
        type: string
        default: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
    steps:
      - fetch-verified:
          url: https://static.rust-lang.org/rustup/archive/1.29.1/<< parameters.triple >>/rustup-init
          sha256: << parameters.sha256 >>
          dest: rustup-init
      - run:
          name: Install Rust
          command: |
            chmod +x rustup-init
            ./rustup-init -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
            rm rustup-init
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"

  set-release-version:
    description: >-
      Export RELEASE_VERSION and DEB_VERSION. On a release tag they come from the tag; in a
      rehearsal (no tag) from Cargo.toml, with a -rehearsal.<sha> suffix on file names.
    steps:
      - run:
          name: Release version
          command: |
            if [ -n "${CIRCLE_TAG:-}" ]; then
              version="${CIRCLE_TAG#v}"
              deb="${version}-1"
            else
              cargo=$(sed -n '/^\[package\]/,/^\[/{/^version[[:space:]]*=/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;q;};}' Cargo.toml)
              version="${cargo}-rehearsal.$(printf '%.7s' "$CIRCLE_SHA1")"
              deb="${cargo}-1"
            fi
            echo "export RELEASE_VERSION='${version}' DEB_VERSION='${deb}'" >> "$BASH_ENV"
            echo "release version ${version}, package version ${deb}"

  with-cargo-cache:
    description: >-
      Restore the Cargo registry, git checkouts and target directory, run the steps, then save
      them under a new key (FR-019, FR-021, research R13). Keys carry the job, the pinned Rust
      version and the architecture; every run saves, so the next one restores the newest output.
    parameters:
      key:
        type: string
      cargo-home:
        type: string
        default: /usr/local/cargo
      shell:
        type: string
        default: /bin/bash -eo pipefail
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - cargo-v2-<< parameters.key >>-<< pipeline.parameters.rust-version >>-{{ arch }}-{{ checksum "Cargo.lock" }}-
            - cargo-v2-<< parameters.key >>-<< pipeline.parameters.rust-version >>-{{ arch }}-
      - steps: << parameters.steps >>
      - run:
          name: Prune incremental build data
          shell: << parameters.shell >>
          command: rm -rf target/*/incremental target/*/*/incremental
      - save_cache:
          key: cargo-v2-<< parameters.key >>-<< pipeline.parameters.rust-version >>-{{ arch }}-{{ checksum "Cargo.lock" }}-{{ epoch }}
          paths:
            - << parameters.cargo-home >>/registry
            - << parameters.cargo-home >>/git
            - target

jobs:
  lint:
    executor: rust
    steps:
      - checkout
      - run:
          name: Install rustfmt and clippy
          command: rustup component add rustfmt clippy
      - with-cargo-cache:
          key: lint
          steps:
            - run:
                name: Format
                command: cargo fmt --check
            - run:
                name: Clippy
                command: cargo clippy --locked --all-targets -- -D warnings

  test-rust:
    executor: rust
    steps:
      - checkout
      - with-cargo-cache:
          key: test
          steps:
            - run:
                name: Tests
                command: cargo test --locked

  # Vulnerable dependencies, licences and documentation warnings (FR-025, research R14).
  # rustdoc's bare_urls lint is allowed: the doc comments of the command-line options are also
  # the --help text, where URLs stay plain.
  audit:
    executor: rust
    steps:
      - checkout
      - fetch-verified:
          url: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          sha256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          dest: cargo-deny.tar.gz
      - run:
          name: Install cargo-deny 0.20.2
          command: |
            tar -xzf cargo-deny.tar.gz --strip-components=1 -C /usr/local/cargo/bin \
              cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
            rm cargo-deny.tar.gz
      - run:
          name: Advisories and licences
          command: cargo deny check advisories licenses
      - with-cargo-cache:
          key: audit
          steps:
            - run:
                name: Documentation
                command: RUSTDOCFLAGS="-D warnings -A rustdoc::bare_urls" cargo doc --no-deps --locked

  # Weekly, on the newest stable Rust (FR-026). Not quality gates: different job names, so they
  # never set the status of a required check, and they never block a release.
  lint-stable:
    executor: rust
    steps:
      - checkout
      - run:
          name: Format and clippy on stable
          command: |
            rustup toolchain install stable --profile minimal -c rustfmt,clippy
            export RUSTUP_TOOLCHAIN=stable
            rustc --version
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings

  test-rust-stable:
    executor: rust
    steps:
      - checkout
      - run:
          name: Tests on stable
          command: |
            rustup toolchain install stable --profile minimal
            export RUSTUP_TOOLCHAIN=stable
            rustc --version
            cargo test --locked

  test-web:
    executor: node
    steps:
      - checkout
      - run:
          name: Frontend tests
          command: node --test 'web/*.test.js'

  test-tools:
    executor: python
    steps:
      - checkout
      - run:
          name: Python tool tests
          command: python3 -m unittest discover -s tools -p 'test_*.py'
      - run:
          name: CI script tests
          command: |
            sh scripts/test-check-version.sh
            sh scripts/test-changelog-section.sh
            sh scripts/test-check-secrets.sh
            sh scripts/test-check-release-files.sh

  # Release gate, before any build (FR-002, FR-013, FR-032): the tag is "v" + the Cargo.toml
  # version, CHANGELOG.md has notes for it, and the publishing secrets are present. It runs
  # with the release context, which CircleCI only grants to v* tags.
  check-version:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Tag matches Cargo.toml
          command: sh scripts/check-version.sh "$CIRCLE_TAG"
      - run:
          name: Release notes in CHANGELOG.md
          command: sh scripts/changelog-section.sh "${CIRCLE_TAG#v}" > /dev/null
      - run:
          name: Publishing secrets present
          command: sh scripts/check-secrets.sh GITHUB_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN

  # Static musl binaries through cross (Cross.toml). Cross-compiling happens only here.
  # Raw binaries stay in the workspace under bin/; only release/ is published.
  build-linux:
    executor: linux-machine
    parameters:
      target:
        type: string
    steps:
      - checkout
      - install-rustup
      - fetch-verified:
          url: https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz
          sha256: a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588
          dest: cross.tar.gz
      - run:
          name: Install cross 0.2.5
          command: tar -xzf cross.tar.gz -C "$HOME/.cargo/bin" cross && rm cross.tar.gz
      - run:
          name: Build
          command: |
            cross build --release --locked --target << parameters.target >>
      - set-release-version
      - run:
          name: Archive with the license and the example
          command: |
            version="${RELEASE_VERSION}"
            mkdir -p ws/bin/<< parameters.target >> ws/release stage
            cp target/<< parameters.target >>/release/live-qso-map ws/bin/<< parameters.target >>/
            install -m 755 target/<< parameters.target >>/release/live-qso-map stage/live-qso-map
            cp LICENSE.md deploy/config.example.toml stage/
            tar -czf "ws/release/live-qso-map-${version}-<< parameters.target >>.tar.gz" -C stage live-qso-map LICENSE.md config.example.toml
      - persist_to_workspace:
          root: ws
          paths:
            - bin/<< parameters.target >>
            - release

  build-macos:
    executor: macos
    steps:
      - checkout
      - install-rustup:
          triple: aarch64-apple-darwin
          sha256: ec1b9233e7f72990ecd8e62063fa7f6c3dfc2bec8e97f88bff165f9100ac696a
      - with-cargo-cache:
          key: build-macos
          cargo-home: ~/.cargo
          steps:
            - run:
                name: Build
                command: cargo build --release --locked
      - run:
          name: Collect the binary
          command: |
            mkdir -p ws/bin/aarch64-apple-darwin
            cp target/release/live-qso-map ws/bin/aarch64-apple-darwin/
      - persist_to_workspace:
          root: ws
          paths:
            - bin/aarch64-apple-darwin

  build-windows:
    executor: win/server-2025
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
    steps:
      - checkout
      - fetch-verified:
          url: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-pc-windows-msvc/rustup-init.exe
          sha256: 6f4bef66261261fcb43131be8720bab817d403a09edec7455c371974b90bdb7e
          dest: rustup-init.exe
          shell: bash.exe
      - run:
          name: Install Rust
          shell: bash.exe
          command: |
            ./rustup-init.exe -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
            rm rustup-init.exe
      - with-cargo-cache:
          key: build-windows
          cargo-home: ~/.cargo
          shell: bash.exe
          steps:
            - run:
                name: Build
                shell: bash.exe
                command: |
                  export PATH="$USERPROFILE/.cargo/bin:$PATH"
                  cargo build --release --locked --target x86_64-pc-windows-msvc
      - run:
          name: Collect the binary
          shell: bash.exe
          command: |
            mkdir -p ws/bin/x86_64-pc-windows-msvc
            cp target/x86_64-pc-windows-msvc/release/live-qso-map.exe ws/bin/x86_64-pc-windows-msvc/
      - persist_to_workspace:
          root: ws
          paths:
            - bin/x86_64-pc-windows-msvc

  # cargo-deb, built once per release (and cached across releases), for the three package-deb
  # jobs (FR-020).
  cargo-deb:
    executor: rust
    steps:
      - restore_cache:
          keys:
            - cargo-deb-3.8.0-<< pipeline.parameters.rust-version >>-{{ arch }}
      - run:
          name: Install cargo-deb 3.8.0
          command: |
            [ -x "$HOME/cargo-deb/bin/cargo-deb" ] || cargo install cargo-deb --version 3.8.0 --locked --root "$HOME/cargo-deb"
            mkdir -p ws/tools
            cp "$HOME/cargo-deb/bin/cargo-deb" ws/tools/
      - save_cache:
          key: cargo-deb-3.8.0-<< pipeline.parameters.rust-version >>-{{ arch }}
          paths:
            - ~/cargo-deb
      - persist_to_workspace:
          root: ws
          paths:
            - tools/cargo-deb

  # Debian package per Linux target from the cross-built binary (contracts/debian-package.md).
  package-deb:
    executor: rust
    parameters:
      target:
        type: string
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - set-release-version
      - run:
          name: Use the shared cargo-deb
          command: echo 'export PATH="$PWD/ws/tools:$PATH"' >> "$BASH_ENV"
      - run:
          name: Package
          command: |
            mkdir -p target/<< parameters.target >>/release
            cp ws/bin/<< parameters.target >>/live-qso-map target/<< parameters.target >>/release/
            cargo deb --target << parameters.target >> --no-build --no-strip --output ws/release/
      - run:
          name: Check architecture and contents
          command: |
            case << parameters.target >> in
              x86_64-*) want=amd64 ;;
              aarch64-*) want=arm64 ;;
              armv7-*) want=armhf ;;
            esac
            deb=$(ls ws/release/live-qso-map_*_"$want".deb)
            got=$(dpkg-deb --field "$deb" Architecture)
            [ "$got" = "$want" ] || { echo "Architecture $got, wanted $want"; exit 1; }
            got=$(dpkg-deb --field "$deb" Version)
            [ "$got" = "${DEB_VERSION}" ] || { echo "Version $got, wanted ${DEB_VERSION}"; exit 1; }
            contents=$(dpkg-deb --contents "$deb")
            for path in ./usr/bin/live-qso-map ./etc/live-qso-map/config.toml live-qso-map.service \
                ./usr/share/doc/live-qso-map/config.example.toml; do
              echo "$contents" | grep -q "$path" || { echo "missing $path"; exit 1; }
            done
            # Only the live configuration is a conffile; the example is always overwritten (FR-010b).
            conffiles=$(dpkg-deb --ctrl-tarfile "$deb" | tar -xOf - ./conffiles)
            [ "$conffiles" = /etc/live-qso-map/config.toml ] || { echo "conffiles: $conffiles"; exit 1; }
            dpkg-deb --info "$deb"
      - persist_to_workspace:
          root: ws
          paths:
            - release/*.deb

  # Install, upgrade, save, remove, purge in a real distribution (scripts/test-deb.sh).
  test-deb:
    parameters:
      image:
        type: string
      arch:
        type: enum
        enum: [amd64, arm64]
        default: amd64
      resource-class:
        type: string
        default: medium
    docker:
      - image: << parameters.image >>
    resource_class: << parameters.resource-class >>
    steps:
      - run:
          name: Install test dependencies
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              adduser systemd git openssh-client ca-certificates
      - checkout
      - attach_workspace:
          at: ./ws
      - run:
          name: Package life cycle
          command: sh scripts/test-deb.sh ws/release/live-qso-map_*_<< parameters.arch >>.deb

  # Windows and macOS zips: program, license, read-me, example; plus the standalone example
  # (contracts/release-artifacts.md, feature 015 contracts/release-deliverables.md).
  package-archives:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - set-release-version
      - run:
          name: Install zip
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip
      - run:
          name: Zip
          command: |
            version="${RELEASE_VERSION}"
            mkdir -p ws/release win mac
            cp ws/bin/x86_64-pc-windows-msvc/live-qso-map.exe win/live-qso-map.exe
            cp LICENSE.md deploy/windows/README.txt deploy/config.example.toml win/
            install -m 755 ws/bin/aarch64-apple-darwin/live-qso-map mac/live-qso-map
            cp LICENSE.md deploy/macos/README.txt deploy/config.example.toml mac/
            (cd win && zip -X "../ws/release/live-qso-map-${version}-windows-x64.zip" live-qso-map.exe LICENSE.md README.txt config.example.toml)
            (cd mac && zip -X "../ws/release/live-qso-map-${version}-macos-arm64.zip" live-qso-map LICENSE.md README.txt config.example.toml)
            cp deploy/config.example.toml ws/release/config.example.toml
            unzip -Z ws/release/live-qso-map-${version}-macos-arm64.zip | grep -- '-rwx' | grep -q ' live-qso-map$'
      - persist_to_workspace:
          root: ws
          paths:
            - release/*.zip
            - release/config.example.toml

  # Real-browser tests (feature 012, contracts/pipeline.md): the x86_64 release binary and its
  # map page in Chrome for Testing, before anything is published. The image holds Chrome's
  # libraries but not Chrome, which is fetched pinned and verified (research R1). No secret.
  browser-test:
    docker:
      - image: cimg/node:24.21.0-browsers
    steps:
      - checkout
      - attach_workspace:
          at: ws
      - fetch-verified:
          url: https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.92/linux64/chrome-linux64.zip
          sha256: ff43322f335e436b2f4dcdfeeec5db032299e335a7e8c1c618b326e100ce8732
          dest: chrome-linux64.zip
      - run:
          name: Unpack Chrome for Testing 154.0.8037.92
          command: unzip -q chrome-linux64.zip && rm chrome-linux64.zip
      # The run step records the result instead of failing, so the artifacts are always stored;
      # the last step then fails the job when the tests failed.
      - run:
          name: Browser tests
          command: |
            status=0
            node tests/browser/run.mjs \
              --binary ws/bin/x86_64-unknown-linux-musl/live-qso-map \
              --chrome chrome-linux64/chrome || status=$?
            echo "$status" > browser-test-status
      - store_artifacts:
          path: target/browser-test
          destination: browser-test
      - run:
          name: Browser test result
          command: exit "$(cat browser-test-status)"

  # Container image (research R6, feature 009 R8): each architecture is built natively from the
  # pipeline binaries and smoke-tested before anything is pushed. Dockerfile.release runs nothing
  # on the target platform, so no emulation is needed.
  image-test:
    parameters:
      arch:
        type: enum
        enum: [amd64, arm64]
      target:
        type: string
      machine-image:
        type: string
        default: ubuntu-2604:current
      resource-class:
        type: string
        default: medium
    machine:
      image: << parameters.machine-image >>
    resource_class: << parameters.resource-class >>
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - set-release-version
      - run:
          name: Lay out the binary
          command: |
            mkdir -p dist/linux/<< parameters.arch >>
            cp ws/bin/<< parameters.target >>/live-qso-map dist/linux/<< parameters.arch >>/
      - run:
          name: Build and smoke-test (<< parameters.arch >>)
          command: |
            docker buildx build --platform linux/<< parameters.arch >> --load \
              --build-arg VERSION="${RELEASE_VERSION}" \
              -f deploy/docker/Dockerfile.release -t lqm-test .
            sh scripts/test-image.sh lqm-test

  # Release only: pushes the tested image for both architectures as the internal <version>-rc
  # tag. docker-promote publishes it after the GitHub release.
  image-push:
    executor: linux-machine
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - run:
          name: Lay out the binaries
          command: |
            mkdir -p dist/linux/amd64 dist/linux/arm64
            cp ws/bin/x86_64-unknown-linux-musl/live-qso-map dist/linux/amd64/
            cp ws/bin/aarch64-unknown-linux-musl/live-qso-map dist/linux/arm64/
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Push the release candidate (amd64 + arm64)
          command: |
            docker buildx create --use --name lqm
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              --build-arg VERSION="${CIRCLE_TAG#v}" \
              -f deploy/docker/Dockerfile.release \
              -t "sardylan/live-qso-map:${CIRCLE_TAG#v}-rc" .

  # Rehearsal only: lists and keeps what a release would publish (FR-011, FR-012).
  rehearsal-summary:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - run:
          name: Rehearsal summary
          command: |
            ls -l ws/release
            echo "publishing secrets: not checked (rehearsal)"
      - store_artifacts:
          path: ws/release
      # After the artefacts are stored, so a failing check still leaves the files to inspect.
      - run:
          name: The example in every release file
          command: sh scripts/check-release-files.sh ws/release deploy/config.example.toml

  # After the GitHub release (FR-018, FR-022, research R8): re-tag the tested -rc manifest as
  # <version> and latest with crane (same digest, no rebuild, no VM), then delete the -rc tag.
  # Re-running it is harmless.
  docker-promote:
    docker:
      - image: cimg/base:current
    steps:
      - fetch-verified:
          url: https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          sha256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
          dest: crane.tar.gz
      - run:
          name: Install crane 0.22.1
          command: |
            mkdir -p "$HOME/bin"
            tar -xzf crane.tar.gz -C "$HOME/bin" crane
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Publish <version> and latest
          command: |
            version="${CIRCLE_TAG#v}"
            repo=sardylan/live-qso-map
            printf '%s' "$DOCKERHUB_TOKEN" | crane auth login index.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
            crane tag "${repo}:${version}-rc" "${version}"
            crane tag "${repo}:${version}-rc" latest
            [ "$(crane digest "${repo}:${version}")" = "$(crane digest "${repo}:latest")" ]
      - run:
          name: Delete the -rc tag
          command: |
            version="${CIRCLE_TAG#v}"
            repo=sardylan/live-qso-map
            if crane ls "$repo" | grep -qx "${version}-rc"; then
              token=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{identifier: $u, secret: $p}' \
                | curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/auth/token \
                | jq -r .access_token)
              curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer ${token}" \
                "https://hub.docker.com/v2/namespaces/sardylan/repositories/live-qso-map/tags/${version}-rc"
            fi
            if crane ls "$repo" | grep -qx "${version}-rc"; then
              echo "the ${version}-rc tag is still on Docker Hub; remove it in the Hub UI (docs/ci.md)"
              exit 1
            fi

  # Publishes only ws/release (packages and archives), with SHA256SUMS (FR-003, FR-004). The
  # notes are the tag's CHANGELOG.md section (FR-032). On a re-run the release already exists:
  # its files are replaced and its notes are kept (FR-015).
  publish-github-release:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - fetch-verified:
          url: https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
          sha256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
          dest: gh.tar.gz
      - run:
          name: Install gh 2.102.0
          command: |
            mkdir -p "$HOME/bin"
            tar -xzf gh.tar.gz --strip-components=2 -C "$HOME/bin" gh_2.102.0_linux_amd64/bin/gh
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: The example in every release file
          command: sh scripts/check-release-files.sh ws/release deploy/config.example.toml
      - run:
          name: Checksums
          command: cd ws/release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - store_artifacts:
          path: ws/release
      - run:
          name: Publish the GitHub release
          command: |
            repo="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            sh scripts/changelog-section.sh "${CIRCLE_TAG#v}" > notes.md
            if gh release view "$CIRCLE_TAG" --repo "$repo" > /dev/null 2>&1; then
              gh release upload "$CIRCLE_TAG" --repo "$repo" --clobber ws/release/*
            else
              gh release create "$CIRCLE_TAG" --repo "$repo" --verify-tag --title "$CIRCLE_TAG" --notes-file notes.md ws/release/*
            fi

workflows:
  test_and_build:
    when:
      and:
        - not: << pipeline.parameters.rehearsal >>
        - not: << pipeline.parameters.newest-toolchain >>
    jobs:
      # The gates run on every run of this workflow: pushes to main, pull requests and release
      # tags (v2.0.1). Which events start a run is set by the CircleCI trigger (docs/ci.md).
      - lint:
          filters: &every-commit
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - test-rust:
          filters: *every-commit
      - test-web:
          filters: *every-commit
      - test-tools:
          filters: *every-commit
      - audit:
          filters: *every-commit
      # Release builds and the release run on release tags only (constitution Principle V).
      - check-version:
          context: live-qso-map-release
          filters: &release-tags
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - build-linux:
          filters: *release-tags
          name: build-linux-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [check-version, lint, test-rust, test-web, test-tools, audit]
      - build-macos:
          filters: *release-tags
          requires: [check-version, lint, test-rust, test-web, test-tools, audit]
      - build-windows:
          filters: *release-tags
          requires: [check-version, lint, test-rust, test-web, test-tools, audit]
      - cargo-deb:
          filters: *release-tags
          requires: [check-version]
      - package-deb:
          filters: *release-tags
          name: package-deb-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [build-linux-<< matrix.target >>, cargo-deb]
      - test-deb:
          filters: *release-tags
          name: test-deb-debian-12-amd64
          image: "debian:12"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-debian-13-amd64
          image: "debian:13"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-ubuntu-22-04-amd64
          image: "ubuntu:22.04"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-ubuntu-24-04-amd64
          image: "ubuntu:24.04"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-debian-12-arm64
          image: "debian:12"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-debian-13-arm64
          image: "debian:13"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-ubuntu-22-04-arm64
          image: "ubuntu:22.04"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-ubuntu-24-04-arm64
          image: "ubuntu:24.04"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - package-archives:
          filters: *release-tags
          requires: [build-macos, build-windows]
      - image-test:
          filters: *release-tags
          name: image-test-amd64
          arch: amd64
          target: x86_64-unknown-linux-musl
          requires: [build-linux-x86_64-unknown-linux-musl]
      - image-test:
          filters: *release-tags
          name: image-test-arm64
          arch: arm64
          target: aarch64-unknown-linux-musl
          machine-image: ubuntu-2204:current
          resource-class: arm.medium
          requires: [build-linux-aarch64-unknown-linux-musl]
      - browser-test:
          filters: *release-tags
          requires: [build-linux-x86_64-unknown-linux-musl]
      - image-push:
          context: live-qso-map-release
          filters: *release-tags
          requires:
            - image-test-amd64
            - image-test-arm64
      - publish-github-release:
          context: live-qso-map-release
          filters: *release-tags
          requires:
            - package-archives
            - image-push
            - browser-test
            - build-linux
            - build-macos
            - build-windows
            - package-deb
            - test-deb-debian-12-amd64
            - test-deb-debian-13-amd64
            - test-deb-ubuntu-22-04-amd64
            - test-deb-ubuntu-24-04-amd64
            - test-deb-debian-12-arm64
            - test-deb-debian-13-arm64
            - test-deb-ubuntu-22-04-arm64
            - test-deb-ubuntu-24-04-arm64
      - docker-promote:
          context: live-qso-map-release
          filters: *release-tags
          requires: [publish-github-release]

  # Manual rehearsal (FR-011, FR-012): the whole release path on a branch, with no context, no
  # push and no publishing. Start it with --param rehearsal=true (docs/ci.md, section 7).
  rehearsal:
    when: << pipeline.parameters.rehearsal >>
    jobs:
      - build-linux:
          name: build-linux-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
      - build-macos
      - build-windows
      - cargo-deb
      - package-deb:
          name: package-deb-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [build-linux-<< matrix.target >>, cargo-deb]
      - test-deb:
          name: test-deb-debian-12-amd64
          image: "debian:12"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          name: test-deb-debian-13-amd64
          image: "debian:13"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          name: test-deb-ubuntu-22-04-amd64
          image: "ubuntu:22.04"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          name: test-deb-ubuntu-24-04-amd64
          image: "ubuntu:24.04"
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          name: test-deb-debian-12-arm64
          image: "debian:12"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - test-deb:
          name: test-deb-debian-13-arm64
          image: "debian:13"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - test-deb:
          name: test-deb-ubuntu-22-04-arm64
          image: "ubuntu:22.04"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - test-deb:
          name: test-deb-ubuntu-24-04-arm64
          image: "ubuntu:24.04"
          arch: arm64
          resource-class: arm.medium
          requires: [package-deb-aarch64-unknown-linux-musl]
      - package-archives:
          requires: [build-macos, build-windows]
      - image-test:
          name: image-test-amd64
          arch: amd64
          target: x86_64-unknown-linux-musl
          requires: [build-linux-x86_64-unknown-linux-musl]
      - image-test:
          name: image-test-arm64
          arch: arm64
          target: aarch64-unknown-linux-musl
          machine-image: ubuntu-2204:current
          resource-class: arm.medium
          requires: [build-linux-aarch64-unknown-linux-musl]
      - browser-test:
          requires: [build-linux-x86_64-unknown-linux-musl]
      - rehearsal-summary:
          requires:
            - build-linux
            - build-macos
            - build-windows
            - package-deb
            - test-deb-debian-12-amd64
            - test-deb-debian-13-amd64
            - test-deb-ubuntu-22-04-amd64
            - test-deb-ubuntu-24-04-amd64
            - test-deb-debian-12-arm64
            - test-deb-debian-13-arm64
            - test-deb-ubuntu-22-04-arm64
            - test-deb-ubuntu-24-04-arm64
            - package-archives
            - image-test-amd64
            - image-test-arm64
            - browser-test

  # Weekly schedule trigger (newest-toolchain=true, docs/ci.md section 9).
  newest_toolchain:
    when: << pipeline.parameters.newest-toolchain >>
    jobs:
      - lint-stable
      - test-rust-stable
