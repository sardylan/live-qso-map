---
version: 2.1

orbs:
  win: circleci/windows@5.1.1

# Pinned Rust for CI (docs/rust-guidelines.md §2.2); keep in step with the Dockerfile.
# RUSTUP_TOOLCHAIN makes it win over rust-toolchain.toml, which tracks latest stable.
parameters:
  rust-version:
    type: string
    default: "1.99"

executors:
  rust:
    docker:
      - image: rust:<< pipeline.parameters.rust-version >>
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  node:
    docker:
      - image: node:24
  python:
    docker:
      - image: python:3.14
  linux-machine:
    machine:
      image: ubuntu-2604:current
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  macos:
    macos:
      xcode: "27.0"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  github:
    docker:
      - image: cibuilds/github:0.13.0

commands:
  install-rustup:
    description: Install the Rust toolchain used by the project
    steps:
      - run:
          name: Install Rust
          command: |
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"

  with-cargo-cache:
    description: Restore the Cargo registry and target directory, run the steps, then save them
    parameters:
      key:
        type: string
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
            - cargo-v1-<< parameters.key >>-
      - steps: << parameters.steps >>
      - save_cache:
          key: cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
          paths:
            - /usr/local/cargo/registry
            - target

jobs:
  lint:
    executor: rust
    steps:
      - checkout
      - run:
          name: Install rustfmt and clippy
          command: rustup component add rustfmt clippy
      - with-cargo-cache:
          key: lint
          steps:
            - run:
                name: Format
                command: cargo fmt --check
            - run:
                name: Clippy
                command: cargo clippy --locked --all-targets -- -D warnings

  test-rust:
    executor: rust
    steps:
      - checkout
      - with-cargo-cache:
          key: test
          steps:
            - run:
                name: Tests
                command: cargo test --locked

  test-web:
    executor: node
    steps:
      - checkout
      - run:
          name: Frontend tests
          command: node --test web/

  test-tools:
    executor: python
    steps:
      - checkout
      - run:
          name: Python tool tests
          command: python3 -m unittest tools/test_entity_extents.py

  # Static musl binaries through cross (Cross.toml). Cross-compiling happens only here.
  build-linux:
    executor: linux-machine
    parameters:
      target:
        type: string
    steps:
      - checkout
      - install-rustup
      - run:
          name: Install cross
          command: |
            curl -sSfL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz -C "$HOME/.cargo/bin"
      - run:
          name: Build
          command: |
            cross build --release --locked --target << parameters.target >>
            mkdir -p dist
            cp target/<< parameters.target >>/release/live-qso-map dist/live-qso-map-<< parameters.target >>
      - persist_to_workspace:
          root: dist
          paths:
            - live-qso-map-<< parameters.target >>

  build-macos:
    executor: macos
    steps:
      - checkout
      - install-rustup
      - run:
          name: Build
          command: |
            cargo build --release --locked
            mkdir -p dist
            cp target/release/live-qso-map dist/live-qso-map-aarch64-apple-darwin
      - persist_to_workspace:
          root: dist
          paths:
            - live-qso-map-aarch64-apple-darwin

  build-windows:
    executor: win/server-2025
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
    steps:
      - checkout
      - run:
          name: Install Rust
          shell: bash.exe
          command: |
            curl -sSfLo rustup-init.exe https://win.rustup.rs/x86_64
            ./rustup-init.exe -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
      - run:
          name: Build
          shell: bash.exe
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            cargo build --release --locked --target x86_64-pc-windows-msvc
            mkdir -p dist
            cp target/x86_64-pc-windows-msvc/release/live-qso-map.exe dist/live-qso-map-x86_64-pc-windows-msvc.exe
      - persist_to_workspace:
          root: dist
          paths:
            - live-qso-map-x86_64-pc-windows-msvc.exe

  store-artifacts:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - store_artifacts:
          path: /tmp/workspace

  publish-github-release:
    executor: github
    steps:
      - attach_workspace:
          at: ./workspace
      - run:
          name: Publish the GitHub release
          command: ghr -t "${GITHUB_TOKEN}" -u "${CIRCLE_PROJECT_USERNAME}" -r "${CIRCLE_PROJECT_REPONAME}" -c "${CIRCLE_SHA1}" -delete "${CIRCLE_TAG}" ./workspace/

workflows:
  test_and_build:
    jobs:
      # Tests run on every branch and on release tags (v2.0.0).
      - lint:
          filters: &every-commit
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - test-rust:
          filters: *every-commit
      - test-web:
          filters: *every-commit
      - test-tools:
          filters: *every-commit
      # Release builds and the release run on release tags only (constitution Principle V).
      - build-linux:
          filters: &release-tags
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          name: build-linux-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [lint, test-rust, test-web, test-tools]
      - build-macos:
          filters: *release-tags
          requires: [lint, test-rust, test-web, test-tools]
      - build-windows:
          filters: *release-tags
          requires: [lint, test-rust, test-web, test-tools]
      - store-artifacts:
          filters: *release-tags
          requires: [build-linux, build-macos, build-windows]
      - publish-github-release:
          filters: *release-tags
          requires: [store-artifacts]
