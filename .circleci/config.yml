---
version: 2.1

orbs:
  win: circleci/windows@5.1.1

# Pinned Rust for CI (docs/rust-guidelines.md §2.2); keep in step with the Dockerfile.
# RUSTUP_TOOLCHAIN makes it win over rust-toolchain.toml, which tracks latest stable.
parameters:
  rust-version:
    type: string
    default: "1.99"

executors:
  rust:
    docker:
      - image: rust:<< pipeline.parameters.rust-version >>
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  node:
    docker:
      - image: node:24
  python:
    docker:
      - image: python:3.14
  linux-machine:
    machine:
      image: ubuntu-2604:current
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  macos:
    macos:
      xcode: "27.0"
    resource_class: m4pro.medium
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
  github:
    docker:
      - image: cibuilds/github:0.13.0

commands:
  install-rustup:
    description: Install the Rust toolchain used by the project
    steps:
      - run:
          name: Install Rust
          command: |
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"

  with-cargo-cache:
    description: Restore the Cargo registry and target directory, run the steps, then save them
    parameters:
      key:
        type: string
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
            - cargo-v1-<< parameters.key >>-
      - steps: << parameters.steps >>
      - save_cache:
          key: cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
          paths:
            - /usr/local/cargo/registry
            - target

jobs:
  lint:
    executor: rust
    steps:
      - checkout
      - run:
          name: Install rustfmt and clippy
          command: rustup component add rustfmt clippy
      - with-cargo-cache:
          key: lint
          steps:
            - run:
                name: Format
                command: cargo fmt --check
            - run:
                name: Clippy
                command: cargo clippy --locked --all-targets -- -D warnings

  test-rust:
    executor: rust
    steps:
      - checkout
      - with-cargo-cache:
          key: test
          steps:
            - run:
                name: Tests
                command: cargo test --locked

  test-web:
    executor: node
    steps:
      - checkout
      - run:
          name: Frontend tests
          command: node --test web/

  test-tools:
    executor: python
    steps:
      - checkout
      - run:
          name: Python tool tests
          command: python3 -m unittest tools/test_entity_extents.py

  # Release gate (FR-002): the tag must be "v" + the Cargo.toml version.
  check-version:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Test the version gate
          command: sh scripts/test-check-version.sh
      - run:
          name: Tag matches Cargo.toml
          command: sh scripts/check-version.sh "$CIRCLE_TAG"

  # Static musl binaries through cross (Cross.toml). Cross-compiling happens only here.
  # Raw binaries stay in the workspace under bin/; only release/ is published.
  build-linux:
    executor: linux-machine
    parameters:
      target:
        type: string
    steps:
      - checkout
      - install-rustup
      - run:
          name: Install cross
          command: |
            curl -sSfL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz -C "$HOME/.cargo/bin"
      - run:
          name: Build
          command: |
            cross build --release --locked --target << parameters.target >>
      - run:
          name: Archive with the license
          command: |
            version="${CIRCLE_TAG#v}"
            mkdir -p ws/bin/<< parameters.target >> ws/release stage
            cp target/<< parameters.target >>/release/live-qso-map ws/bin/<< parameters.target >>/
            install -m 755 target/<< parameters.target >>/release/live-qso-map stage/live-qso-map
            cp LICENSE.md stage/
            tar -czf "ws/release/live-qso-map-${version}-<< parameters.target >>.tar.gz" -C stage live-qso-map LICENSE.md
      - persist_to_workspace:
          root: ws
          paths:
            - bin/<< parameters.target >>
            - release

  build-macos:
    executor: macos
    steps:
      - checkout
      - install-rustup
      - run:
          name: Build
          command: |
            cargo build --release --locked
            mkdir -p ws/bin/aarch64-apple-darwin
            cp target/release/live-qso-map ws/bin/aarch64-apple-darwin/
      - persist_to_workspace:
          root: ws
          paths:
            - bin/aarch64-apple-darwin

  build-windows:
    executor: win/server-2025
    environment:
      RUSTUP_TOOLCHAIN: << pipeline.parameters.rust-version >>
    steps:
      - checkout
      - run:
          name: Install Rust
          shell: bash.exe
          command: |
            curl -sSfLo rustup-init.exe https://win.rustup.rs/x86_64
            ./rustup-init.exe -y --profile minimal --default-toolchain << pipeline.parameters.rust-version >>
      - run:
          name: Build
          shell: bash.exe
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            cargo build --release --locked --target x86_64-pc-windows-msvc
            mkdir -p ws/bin/x86_64-pc-windows-msvc
            cp target/x86_64-pc-windows-msvc/release/live-qso-map.exe ws/bin/x86_64-pc-windows-msvc/
      - persist_to_workspace:
          root: ws
          paths:
            - bin/x86_64-pc-windows-msvc

  # Debian package per Linux target from the cross-built binary (contracts/debian-package.md).
  package-deb:
    executor: rust
    parameters:
      target:
        type: string
    steps:
      - checkout
      - attach_workspace:
          at: ./ws
      - run:
          name: Install cargo-deb
          command: cargo install cargo-deb --version 3.8.0 --locked
      - run:
          name: Package
          command: |
            mkdir -p target/<< parameters.target >>/release
            cp ws/bin/<< parameters.target >>/live-qso-map target/<< parameters.target >>/release/
            cargo deb --target << parameters.target >> --no-build --no-strip --output ws/release/
      - run:
          name: Check architecture and contents
          command: |
            case << parameters.target >> in
              x86_64-*) want=amd64 ;;
              aarch64-*) want=arm64 ;;
              armv7-*) want=armhf ;;
            esac
            deb=$(ls ws/release/live-qso-map_*_"$want".deb)
            got=$(dpkg-deb --field "$deb" Architecture)
            [ "$got" = "$want" ] || { echo "Architecture $got, wanted $want"; exit 1; }
            contents=$(dpkg-deb --contents "$deb")
            for path in ./usr/bin/live-qso-map ./etc/live-qso-map/config.toml live-qso-map.service; do
              echo "$contents" | grep -q "$path" || { echo "missing $path"; exit 1; }
            done
            dpkg-deb --info "$deb"
      - persist_to_workspace:
          root: ws
          paths:
            - release/*.deb

  # Install, upgrade, save, remove, purge in a real distribution (scripts/test-deb.sh).
  test-deb:
    parameters:
      image:
        type: string
    docker:
      - image: << parameters.image >>
    steps:
      - run:
          name: Install test dependencies
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              adduser systemd git openssh-client ca-certificates
      - checkout
      - attach_workspace:
          at: ./ws
      - run:
          name: Package life cycle
          command: sh scripts/test-deb.sh ws/release/live-qso-map_*_amd64.deb

  # Publishes only ws/release (packages and archives), with SHA256SUMS (FR-003, FR-004).
  publish-github-release:
    executor: github
    steps:
      - attach_workspace:
          at: ./ws
      - run:
          name: Checksums
          command: cd ws/release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - store_artifacts:
          path: ws/release
      - run:
          name: Publish the GitHub release
          command: ghr -t "${GITHUB_TOKEN}" -u "${CIRCLE_PROJECT_USERNAME}" -r "${CIRCLE_PROJECT_REPONAME}" -c "${CIRCLE_SHA1}" -delete "${CIRCLE_TAG}" ./ws/release/

workflows:
  test_and_build:
    jobs:
      # Tests run on every branch and on release tags (v2.0.0).
      - lint:
          filters: &every-commit
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - test-rust:
          filters: *every-commit
      - test-web:
          filters: *every-commit
      - test-tools:
          filters: *every-commit
      # Release builds and the release run on release tags only (constitution Principle V).
      - check-version:
          filters: &release-tags
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - build-linux:
          filters: *release-tags
          name: build-linux-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [check-version, lint, test-rust, test-web, test-tools]
      - build-macos:
          filters: *release-tags
          requires: [check-version, lint, test-rust, test-web, test-tools]
      - build-windows:
          filters: *release-tags
          requires: [check-version, lint, test-rust, test-web, test-tools]
      - package-deb:
          filters: *release-tags
          name: package-deb-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [build-linux-<< matrix.target >>]
      - test-deb:
          filters: *release-tags
          name: test-deb-debian-12
          image: debian:12
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-debian-13
          image: debian:13
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-ubuntu-22-04
          image: ubuntu:22.04
          requires: [package-deb-x86_64-unknown-linux-musl]
      - test-deb:
          filters: *release-tags
          name: test-deb-ubuntu-24-04
          image: ubuntu:24.04
          requires: [package-deb-x86_64-unknown-linux-musl]
      - publish-github-release:
          filters: *release-tags
          requires:
            - build-linux
            - build-macos
            - build-windows
            - package-deb
            - test-deb-debian-12
            - test-deb-debian-13
            - test-deb-ubuntu-22-04
            - test-deb-ubuntu-24-04
