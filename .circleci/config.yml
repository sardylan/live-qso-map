---
version: 2.1

orbs:
  win: circleci/windows@5.0.0

executors:
  rust:
    docker:
      - image: rust:1.98  # same toolchain as the Dockerfile
  node:
    docker:
      - image: node:22
  python:
    docker:
      - image: python:3.13
  linux-machine:
    machine:
      image: ubuntu-2404:current
  macos:
    macos:
      xcode: 16.1.0
    resource_class: macos.m1.medium.gen1
  github:
    docker:
      - image: cibuilds/github:0.10

commands:
  install-rustup:
    description: Install the Rust toolchain used by the project
    steps:
      - run:
          name: Install Rust
          command: |
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"

jobs:
  lint:
    executor: rust
    steps:
      - checkout
      - run:
          name: Install rustfmt and clippy
          command: rustup component add rustfmt clippy
      - run:
          name: Format
          command: cargo fmt --check
      - run:
          name: Clippy
          command: cargo clippy --locked --all-targets -- -D warnings

  test-rust:
    executor: rust
    steps:
      - checkout
      - run:
          name: Tests
          command: cargo test --locked

  test-web:
    executor: node
    steps:
      - checkout
      - run:
          name: Frontend tests
          command: node --test web/

  test-tools:
    executor: python
    steps:
      - checkout
      - run:
          name: Python tool tests
          command: python3 -m unittest tools/test_entity_extents.py

  # Static musl binaries through cross, as in Cross.toml and the README.
  build-linux:
    executor: linux-machine
    parameters:
      target:
        type: string
    steps:
      - checkout
      - install-rustup
      - run:
          name: Install cross
          command: |
            curl -sSfL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz -C "$HOME/.cargo/bin"
      - run:
          name: Build
          command: |
            cross build --release --locked --target << parameters.target >>
            mkdir -p dist
            cp target/<< parameters.target >>/release/live-qso-map dist/live-qso-map-<< parameters.target >>
      - persist_to_workspace:
          root: dist
          paths:
            - live-qso-map-<< parameters.target >>

  build-macos:
    executor: macos
    steps:
      - checkout
      - install-rustup
      - run:
          name: Build
          command: |
            cargo build --release --locked
            mkdir -p dist
            cp target/release/live-qso-map dist/live-qso-map-aarch64-apple-darwin
      - persist_to_workspace:
          root: dist
          paths:
            - live-qso-map-aarch64-apple-darwin

  build-windows:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Install Rust
          shell: bash.exe
          command: |
            curl -sSfLo rustup-init.exe https://win.rustup.rs/x86_64
            ./rustup-init.exe -y --profile minimal --default-toolchain 1.98
      - run:
          name: Build
          shell: bash.exe
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            cargo build --release --locked --target x86_64-pc-windows-msvc
            mkdir -p dist
            cp target/x86_64-pc-windows-msvc/release/live-qso-map.exe dist/live-qso-map-x86_64-pc-windows-msvc.exe
      - persist_to_workspace:
          root: dist
          paths:
            - live-qso-map-x86_64-pc-windows-msvc.exe

  store-artifacts:
    executor: rust
    steps:
      - attach_workspace:
          at: /workspace
      - store_artifacts:
          path: /workspace

  publish-github-release:
    executor: github
    steps:
      - attach_workspace:
          at: ./workspace
      - run:
          name: Publish the GitHub release
          command: ghr -t "${GITHUB_TOKEN}" -u "${CIRCLE_PROJECT_USERNAME}" -r "${CIRCLE_PROJECT_REPONAME}" -c "${CIRCLE_SHA1}" -delete "${CIRCLE_TAG}" ./workspace/

workflows:
  test_and_build:
    jobs:
      # Tests run on every branch and on release tags (v2.0.0).
      - lint:
          filters: &every-commit
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - test-rust:
          filters: *every-commit
      - test-web:
          filters: *every-commit
      - test-tools:
          filters: *every-commit
      # Builds and the release run on release tags only.
      - build-linux:
          filters: &release-tags
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          name: build-linux-<< matrix.target >>
          matrix:
            parameters:
              target:
                - x86_64-unknown-linux-musl
                - aarch64-unknown-linux-musl
                - armv7-unknown-linux-musleabihf
          requires: [lint, test-rust, test-web, test-tools]
      - build-macos:
          filters: *release-tags
          requires: [lint, test-rust, test-web, test-tools]
      - build-windows:
          filters: *release-tags
          requires: [lint, test-rust, test-web, test-tools]
      - store-artifacts:
          filters: *release-tags
          requires: [build-linux, build-macos, build-windows]
      - publish-github-release:
          filters: *release-tags
          requires: [store-artifacts]
