[package]
name = "live-qso-map"
version = "3.0.0"
edition = "2024"
authors = ["Luca Cireddu <sardylan@gmail.com>"]
description = "Live map of the QSOs an amateur radio station logs during a contest"
readme = "README.md"
homepage = "https://github.com/sardylan/live-qso-map"
repository = "https://github.com/sardylan/live-qso-map"
license = "GPL-3.0-or-later"
keywords = ["ham-radio", "amateur-radio", "qso", "contest", "map"]
categories = ["command-line-utilities", "visualization"]

# Debian package (feature 008, contracts/debian-package.md). Built only by the pipeline, with
# `cargo deb --target <triple> --no-build` on the binary that `cross` produced (Principle V).
[package.metadata.deb]
section = "hamradio"
priority = "optional"
revision = "1"
depends = "adduser"
extended-description = """\
Your logger sends each QSO over UDP. live-qso-map converts it to ADIF, works out where the \
other station is, and shows it live on a world map in the browser. The service runs as the \
unprivileged live-qso-map account; it is installed disabled until configured."""
maintainer-scripts = "deploy/debian/"
systemd-units = { unit-scripts = "deploy/debian/", enable = false, start = false, restart-after-upgrade = true }
assets = [
    ["target/release/live-qso-map", "usr/bin/", "755"],
    ["deploy/config.example.toml", "etc/live-qso-map/config.toml", "640"],
    ["README.md", "usr/share/doc/live-qso-map/README.md", "644"],
    ["LICENSE.md", "usr/share/doc/live-qso-map/copyright", "644"],
]

[dependencies]
async-channel = "2.5"
axum = { version = "0.8", default-features = false, features = ["http1", "ws", "tokio", "json"] }
clap = { version = "4.6", features = ["derive", "wrap_help", "unicode"] }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.30"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
