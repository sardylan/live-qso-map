<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="lqm-version" content="__LQM_VERSION__">
  <title>Live QSO Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.css"
        integrity="sha512-KIMsMWIdnoG9OwZa+oaIafmbDonqck1UCmq+/zcUi2aaZ97N9QE6TqpTM+n36EO40HGh64hU/375zxtjx7WTyQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.js"
          integrity="sha512-rOFgoUgWaVi69JW1dzBu6PWF9xKW9rxYfY5u2SexFABHhWk0qUWkJoWNz4UuZRMvSXsNZG66+tU5B+HlwWF5kA=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- The column beside the map, top to bottom (feature 018, FR-002): the station status line
       (feature 017), the score line (feature 007) and the last-QSO box. -->
  <aside id="column" class="column">
    <div id="station" class="score station" aria-live="polite">— · —</div>
    <!-- aria-hidden: a change every second must not flood screen readers. -->
    <div id="clock" class="clock" aria-hidden="true"></div>
    <div id="score" class="score" aria-live="polite">Score —</div>
    <div id="recent" class="recent" hidden aria-label="Last QSOs"></div>
    <div id="version" class="version"></div>
  </aside>
  <!-- The map area: its overlays are placed against it, not the window (feature 018, R1). -->
  <main id="stage" class="stage">
    <div id="map"></div>
    <div id="no-webgl" class="no-webgl" hidden>
      This map needs WebGL. Enable hardware acceleration in your browser settings, or try another browser.
    </div>
    <div id="status" class="banner" hidden>reconnecting…</div>
    <div id="basemap-error" class="banner banner-low" hidden>Base map unavailable; QSOs are still shown.</div>
    <div id="legend" class="legend" hidden></div>
  </main>
  <!-- Every viewer setting, in a side panel opened by the gear button (feature 011, FR-005). -->
  <aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
    <div class="panel-head">
      <h2 id="panel-title">Settings</h2>
      <button type="button" id="panel-close" class="panel-close" aria-label="Close settings">✕</button>
    </div>
    <fieldset id="group-map">
      <legend>Map</legend>
      <label>Last
        <select id="limit">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
        QSOs
      </label>
      <label><input type="checkbox" id="atmosphere"> Atmosphere on the globe</label>
      <label><input type="checkbox" id="grayline"> Grayline (day and night)</label>
      <label><input type="checkbox" id="sun-marker"> Sun position</label>
    </fieldset>
    <fieldset id="group-box">
      <legend>Last QSOs box</legend>
      <label><input type="checkbox" id="recent-shown"> Shown</label>
      <label>Size
        <select id="recent-size">
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </label>
      <label>Newest
        <select id="recent-order">
          <option value="bottom">bottom</option>
          <option value="top">top</option>
        </select>
      </label>
    </fieldset>
    <fieldset id="group-appearance">
      <legend>Appearance</legend>
      <label>Theme
        <select id="theme">
          <option value="auto-device">Automatic (device)</option>
          <option value="auto-sun">Automatic (sun at station)</option>
          <option value="light">Light</option>
          <option value="dim">Dim</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <p id="theme-status" class="theme-status" aria-live="polite"></p>
    </fieldset>
    <fieldset id="group-legend">
      <legend>Legend</legend>
      <label><input type="checkbox" id="legend-all" checked> All considered bands</label>
      <div id="legend-groups"></div>
    </fieldset>
  </aside>
  <script type="module" src="app.js"></script>
</body>
</html>
