# cargo-deny 0.20.2 configuration for the audit gate (feature 009, FR-025, research R14).
# Run locally (optional): cargo deny check advisories licenses

[advisories]
# Defaults: known vulnerabilities fail the check; unmaintained and yanked crates are reported.
# To accept an advisory, add its id to `ignore` with the reason and a follow-up.
ignore = []

[licenses]
# Every licence here is compatible with the project's GPL-3.0-or-later. A dependency with any
# other licence fails the gate until it is reviewed and, if compatible, added.
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
