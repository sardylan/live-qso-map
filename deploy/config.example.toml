# live-qso-map configuration (contracts/configuration.md).
# Precedence: command line > LQM_* environment variables > this file > built-in defaults.
#
# Installed by the Debian package as /etc/live-qso-map/config.toml (root:live-qso-map, 0640);
# the service runs as the unprivileged live-qso-map account and reads it with --config.
# Every setting is listed with its default, commented out. To write a complete file from
# options instead, for example:
#   sudo live-qso-map --config /etc/live-qso-map/config.toml --station-callsign IS0MZK \
#     --save-config /etc/live-qso-map/config.toml
# then: sudo systemctl enable --now live-qso-map
#
# Passwords set here are readable by root and the service only. Environment variables
# (e.g. LQM_QRZ_PASSWORD) are an alternative.

# bind_address = "0.0.0.0"     # UDP and HTTP listeners
# udp_port = 12060             # QSO messages (ADIF, QARTest)
# http_port = 8080             # map page, WebSocket, /healthz
# history_size = 10000         # QSOs kept in memory; 0 = unbounded
# workers = 1                  # enrichment workers
# ingest_queue = 1024
# broadcast_queue = 1024
# log_level = "info"           # error, warn, info, debug, trace

# Bands to consider; everything else is dropped at ingest and never shown (feature 003).
# Entries are ADIF bands or groups, in any mix; prefix with - to exclude. Groups (frequency order):
#   lf-mf      2190m 630m 560m
#   hf         160m 80m 60m 40m 30m 20m 17m 15m 12m 10m
#   hf-contest 160m 80m 40m 20m 15m 10m
#   warc       30m 17m 12m
#   vhf        8m 6m 5m 4m 2m 1.25m
#   uhf        70cm 33cm 23cm
#   shf        13cm 9cm 6cm 3cm 1.25cm
#   ehf        6mm 4mm 2.5mm 2mm 1mm submm
# bands = ["hf-contest", "-60m"]   # not set = every band

[station]
# Used when an incoming QSO lacks them. The map also draws the house (QTH) at this position, and
# auto-zoom frames the callsign's DXCC entity before the first QSO arrives.
# callsign = "IS0MZK"
# locator = "JM49NH"
# latitude = 39.3125           # set both latitude and longitude, or neither
# longitude = 9.125

[lookup]
# timeout_secs = 5             # per provider; providers are queried in parallel
# provider_order = ["qrz", "hamqth", "qrzcq"]   # breaks ties at equal precision

# A provider is enabled when both username and password are set.
[lookup.qrz]
# username = ""
# password = ""

[lookup.hamqth]
# username = ""
# password = ""

[lookup.qrzcq]
# username = ""
# password = ""

[country_data]
path = "/var/lib/live-qso-map/cty.dat"   # downloaded and refreshed here
# url = "https://www.country-files.com/cty/cty.dat"
# max_age_days = 30            # 0 = never re-download an existing file

[map]
# Base map: either a MapLibre vector style...
# style_url = "https://tiles.openfreemap.org/styles/liberty"   # default (OpenFreeMap, no key)
# style_attribution = "..."                                    # HTML credit (OpenFreeMap's for the default style)
# ...or raster tiles (not both; tile_attribution is then required):
# tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
# tile_attribution = "&copy; OpenStreetMap contributors"
# fallback_color = "#7f7f7f"
# Last-QSO box columns, in display order (feature 006). Keywords:
#   call, band, mode, date, time, cqzone, country
# recent_columns = ["call", "band", "time", "cqzone", "country"]   # default
# recent_header = true                                            # show the header row

[map.bands]
# "40m" = "#d62728"
# "20m" = "#1f77b4"
