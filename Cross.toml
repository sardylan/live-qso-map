# Static Linux release binaries (research R18), built by the CI pipeline only
# (constitution Principle V): x86_64, aarch64 (Raspberry Pi 4/5) and armv7 (Raspberry Pi,
# 32-bit OS) musl targets. See .circleci/config.yml.
[build]
default-target = "x86_64-unknown-linux-musl"

# Images pinned by digest (feature 009, FR-016, research R11), read from ghcr.io on 2026-10-12.
# cross 0.2.5 is still the latest release. If a target stops building with the pinned Rust,
# move it to a pinned ghcr.io/cross-rs/<target>:main digest and note why here.
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:0.2.5@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4"

[target.armv7-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-musleabihf:0.2.5@sha256:b4f481f30ceca34730a5723f717396d762d94f6eddd7e1cf7c7862d1377ff98c"
